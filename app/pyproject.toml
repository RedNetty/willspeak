[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "willspeak"
version = "0.8.0"
description = "Personalized dysarthric speech corpus tooling: recorder, exemplar matcher, evaluation harness."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "soundfile>=0.12",
    "numpy>=1.24",
    "scipy>=1.10",
    "cmudict>=1.0",
    "rapidfuzz>=3.14.5",
    "transformers>=4.44",
    "sherpa-onnx>=1.12.0",
]

[project.optional-dependencies]
train = ["nemo_toolkit[asr]>=2.2", "onnx>=1.17", "onnxruntime>=1.17", "resampy>=0.4",
         "nvidia-cuda-nvcc-cu12", "numba-cuda[cu12]", "numpy<2.3", "wandb>=0.19"]
track = ["wandb>=0.19"]
lm = ["llama-cpp-python>=0.3.32", "huggingface_hub>=0.23"]
dev = ["pytest>=8.0", "jiwer>=3.0", "ruff>=0.12", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
willspeak = ["models/*.npz", "us_spelling.json", "us_spelling.LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
src = ["src", "scripts", "tests"]
